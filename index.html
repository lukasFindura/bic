<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Interest Comparator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #f5f5f3;
  color: #1a1a1a;
  min-height: 100vh;
  padding: 1.5rem 1rem;
}

.app { width: 100%; }

h1 {
  font-size: 17px;
  font-weight: 500;
  text-align: center;
  margin-bottom: 1rem;
  color: #1a1a1a;
}

/* ── bank cards row ── */
.banks-wrapper {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 8px;
  width: 100%;
}
.banks-wrapper::-webkit-scrollbar { height: 4px; }
.banks-wrapper::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

.bank-card {
  background: #fff;
  border: 0.5px solid #ddd;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  flex: 1 1 0;
  min-width: 190px;
  max-width: 280px;
}

.bank-header {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 0.6rem;
  border-bottom: 0.5px solid #eee;
  padding-bottom: 0.5rem;
}

.bank-name-input {
  font-size: 14px;
  font-weight: 500;
  border: none;
  outline: none;
  background: transparent;
  color: #1a1a1a;
  width: 100%;
  min-width: 0;
}
.bank-name-input:focus { border-bottom: 1.5px solid #888; }

.remove-bank-btn {
  background: none; border: none; cursor: pointer;
  color: #ccc; font-size: 16px; line-height: 1;
  padding: 1px 3px; border-radius: 4px; flex-shrink: 0;
}
.remove-bank-btn:hover { color: #c0392b; background: #fdf0f0; }

/* tiers */
.tiers { display: flex; flex-direction: column; gap: 5px; margin-bottom: 0.6rem; }

.tier-row { display: flex; align-items: center; gap: 4px; font-size: 11px; }

.tier-row input[type="number"] {
  border: 0.5px solid #ccc; border-radius: 5px;
  padding: 3px 5px; font-size: 11px;
  background: #fafaf9; color: #1a1a1a; outline: none;
}
.tier-row input[type="number"]:focus { border-color: #888; background: #fff; }
.tier-row input.rate-input { width: 48px; }
.tier-row input.limit-input { width: 96px; }
.tier-row .lbl { color: #999; white-space: nowrap; flex-shrink: 0; }
.tier-row .rest-lbl { color: #ccc; font-style: italic; font-size: 10px; flex: 1; }

.remove-tier-btn {
  background: none; border: none; cursor: pointer;
  color: #ccc; font-size: 13px; line-height: 1;
  padding: 1px 3px; border-radius: 4px; flex-shrink: 0; margin-left: auto;
}
.remove-tier-btn:hover { color: #c0392b; background: #fdf0f0; }

.add-tier-btn {
  background: none; border: 0.5px dashed #ccc;
  border-radius: 5px; padding: 3px 7px;
  font-size: 10px; color: #aaa; cursor: pointer; width: 100%;
}
.add-tier-btn:hover { border-color: #888; color: #555; background: #fafaf9; }

/* balance */
.balance-section {
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 0.5px solid #eee;
}

.balance-row {
  display: flex; align-items: center; gap: 5px;
}
.balance-row label { font-size: 11px; color: #999; flex-shrink: 0; }
.balance-row input {
  flex: 1; border: 0.5px solid #ccc; border-radius: 5px;
  padding: 3px 6px; font-size: 12px;
  background: #fafaf9; color: #1a1a1a; outline: none; min-width: 0;
}
.balance-row input:focus { border-color: #888; background: #fff; }
.balance-row .cur { font-size: 11px; color: #bbb; flex-shrink: 0; }

/* per-bank move buttons */
.move-targets {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 0.5rem;
}
.move-target-btn {
  flex: 1; min-width: 60px;
  background: #f0f6ff; border: 0.5px solid #b8d0ef;
  border-radius: 6px; padding: 4px 6px;
  font-size: 10px; color: #1a5fa8; cursor: pointer;
  white-space: nowrap; text-align: center; line-height: 1.3;
}
.move-target-btn:hover { background: #daeafa; border-color: #7aaee0; }
.move-target-btn:active { transform: scale(0.97); }

/* add bank */
.add-bank-card {
  flex: 0 0 70px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0.5px dashed #bbb;
  border-radius: 10px; padding: 1rem 0.5rem;
  font-size: 11px; color: #aaa; cursor: pointer;
  align-self: stretch; white-space: nowrap;
}
.add-bank-card:hover { border-color: #888; color: #555; background: #fafaf9; }

/* step control bar */
.step-bar {
  background: #fff; border: 0.5px solid #ddd;
  border-radius: 8px; padding: 0.5rem 0.9rem;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.step-bar label { font-size: 11px; color: #999; }
.step-bar input {
  width: 110px; border: 0.5px solid #ccc; border-radius: 5px;
  padding: 3px 6px; font-size: 12px;
  background: #fafaf9; color: #1a1a1a; outline: none;
}
.step-bar input:focus { border-color: #888; }
.step-bar .cur { font-size: 11px; color: #aaa; }

/* results panel */
.results {
  background: #fff; border: 0.5px solid #ddd;
  border-radius: 10px; padding: 0.9rem 1.1rem;
  margin-bottom: 8px;
}
.results-row { display: flex; gap: 0; overflow-x: auto; }

.result-bank {
  flex: 1; min-width: 130px;
  padding: 0 0.9rem;
  border-right: 0.5px solid #eee;
}
.result-bank:first-child { padding-left: 0; }
.result-bank:last-child { border-right: none; padding-right: 0; }

.result-bank .rlabel {
  font-size: 10px; color: #bbb; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px;
}
.result-interest { font-size: 16px; font-weight: 500; color: #1a1a1a; }
.result-balance-lbl { font-size: 10px; color: #bbb; margin-top: 1px; }
.tier-breakdown { font-size: 10px; color: #999; margin-top: 3px; line-height: 1.6; }

.results-total {
  padding-top: 0.6rem; border-top: 0.5px solid #eee; margin-top: 0.6rem;
  display: flex; flex-direction: column; gap: 5px;
}
.total-row {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.total-label { font-size: 12px; color: #888; min-width: 130px; }
.total-amount { font-size: 20px; font-weight: 500; color: #1a7a3f; }
.total-amount.muted { font-size: 16px; color: #555; }
.total-sub { font-size: 11px; color: #bbb; }

/* diff badge */
.diff-badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 5px;
  margin-left: 4px;
}
.diff-pos { background: #e8f8ef; color: #1a7a3f; }
.diff-neg { background: #fdf0f0; color: #b33; }
.diff-neu { background: #f2f2f0; color: #999; }

/* save/restore bar */
.save-bar {
  background: #fff; border: 0.5px solid #ddd;
  border-radius: 8px; padding: 0.5rem 0.9rem;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.save-bar .save-label { font-size: 11px; color: #999; }
.save-btn {
  background: #fff; border: 0.5px solid #ccc;
  border-radius: 6px; padding: 4px 12px;
  font-size: 12px; color: #333; cursor: pointer;
}
.save-btn:hover { background: #f5f5f3; border-color: #888; }
.save-btn.primary {
  background: #1a5fa8; border-color: #1a5fa8; color: #fff;
}
.save-btn.primary:hover { background: #1650a0; }

.save-btn.restore {
  border-color: #b8d0ef; color: #1a5fa8;
}
.save-btn.restore:hover { background: #eef4fc; }
.save-btn.danger {
  border-color: #f0b8b8; color: #a33;
}
.save-btn.danger:hover { background: #fdf0f0; border-color: #d08080; }

.saved-snapshot {
  font-size: 11px; color: #aaa;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.saved-snapshot strong { color: #666; }
</style>
</head>
<body>
<div class="app">
  <h1>Bank interest comparator</h1>
  <div class="banks-wrapper" id="banks-container"></div>
  <div class="step-bar">
    <label>Move step</label>
    <input type="text" id="step-input" value="10 000"
      onfocus="this.value=parseRaw(this.value)"
      onblur="state.step=parseRaw(this.value)||10000; persistState(); this.value=fmtNum(state.step)"
      onkeydown="if(event.key==='Enter'){state.step=parseRaw(this.value)||10000;persistState();this.value=fmtNum(state.step);this.blur()}">
    <span class="cur">Kč</span>
  </div>
  <div class="results" id="results"></div>
  <div style="height:8px"></div>
  <div class="save-bar" id="save-bar"></div>
</div>

<script>
const LS_STATE = 'bic_state';
const LS_SAVED = 'bic_saved';

let bankCounter = 1;
let saved = null; // snapshot

const DEFAULT_STATE = {
  step: 10000,
  banks: [
    { id: 1, name: "My bank", balance: 500000, tiers: [{ rate: 3.2, limit: null }] }
  ]
};

/* ── localStorage persistence ── */
function persistState() {
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch(e) {}
}
function persistSaved() {
  try {
    if (saved) localStorage.setItem(LS_SAVED, JSON.stringify(saved));
    else localStorage.removeItem(LS_SAVED);
  } catch(e) {}
}
function loadFromStorage() {
  try {
    const s = localStorage.getItem(LS_STATE);
    if (s) {
      const parsed = JSON.parse(s);
      Object.assign(state, parsed);
      bankCounter = Math.max(...state.banks.map(b => b.id), 1);
    }
  } catch(e) {}
  try {
    const sv = localStorage.getItem(LS_SAVED);
    if (sv) saved = JSON.parse(sv);
  } catch(e) {}
}

const state = JSON.parse(JSON.stringify(DEFAULT_STATE));

/* ── formatting ── */
function fmtNum(n) {
  const s = Math.round(Math.abs(n)).toString();
  let out = '';
  for (let i = 0; i < s.length; i++) {
    if (i > 0 && (s.length - i) % 3 === 0) out += '\u202f';
    out += s[i];
  }
  return (n < 0 ? '-' : '') + out;
}

function fmt(n) { return fmtNum(n) + '\u00a0Kč'; }

function fmtI(n) {
  const abs = Math.abs(n);
  const whole = Math.floor(abs);
  const dec = Math.round((abs - whole) * 100).toString().padStart(2, '0');
  return (n < 0 ? '-' : '') + fmtNum(whole) + ',' + dec + '\u00a0Kč';
}

function fmtDiff(n) {
  return (n < 0 ? '−' : '+') + fmtNum(Math.round(Math.abs(n))) + '\u00a0Kč';
}

/* parse a possibly-formatted string like "1 234 567" or "1234567" → number */
function parseRaw(s) {
  return parseFloat(String(s).replace(/[\s\u202f\u00a0]/g, '').replace(',', '.')) || 0;
}

/* ── calc ── */
function calcInterest(bank) {
  let remaining = bank.balance;
  let total = 0, breakdown = [], prev = 0;
  for (let i = 0; i < bank.tiers.length; i++) {
    const tier = bank.tiers[i];
    const limit = tier.limit;
    let chunk = limit === null || remaining <= 0
      ? Math.max(0, remaining)
      : Math.min(remaining, Math.max(0, limit - prev));
    if (chunk > 0) {
      const interest = chunk * (tier.rate / 100);
      total += interest;
      breakdown.push({ rate: tier.rate, chunk, interest });
    }
    remaining -= chunk;
    if (limit !== null) prev = limit;
    if (remaining <= 0) break;
  }
  return { total, breakdown };
}

function totalInterest() {
  return state.banks.reduce((s, b) => s + calcInterest(b).total, 0);
}
function totalBalance() {
  return state.banks.reduce((s, b) => s + b.balance, 0);
}

/* ── snapshot ── */
function saveSnapshot() {
  saved = {
    interest: totalInterest(),
    balance: totalBalance(),
    banksConfig: JSON.parse(JSON.stringify(state.banks)),
    banks: state.banks.map(b => ({
      id: b.id, name: b.name, balance: b.balance,
      interest: calcInterest(b).total
    })),
    at: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
  };
  persistSaved();
  renderSaveBar();
  renderResults();
}

function clearSnapshot() {
  saved = null;
  persistSaved();
  renderSaveBar();
  renderResults();
}

function restoreSnapshot() {
  if (!saved || !saved.banksConfig) return;
  state.banks = JSON.parse(JSON.stringify(saved.banksConfig));
  bankCounter = Math.max(...state.banks.map(b => b.id), 1);
  persistState();
  render();
}

/* ── state mutations ── */
function addBank() {
  bankCounter++;
  state.banks.push({
    id: bankCounter,
    name: 'Bank ' + state.banks.length,
    balance: 0,
    tiers: [{ rate: 3.0, limit: null }]
  });
  persistState();
  render();
}

function removeBank(id) {
  if (state.banks.length <= 1) return;
  state.banks = state.banks.filter(b => b.id !== id);
  persistState();
  render();
}

function addTier(id) {
  state.banks.find(b => b.id === id).tiers.push({ rate: 0.0, limit: null });
  persistState();
  render();
}

function removeTier(id, ti) {
  const bank = state.banks.find(b => b.id === id);
  bank.tiers.splice(ti, 1);
  if (!bank.tiers.length) bank.tiers.push({ rate: 3.0, limit: null });
  persistState();
  render();
}

function updateTierRate(id, ti, val) {
  state.banks.find(b => b.id === id).tiers[ti].rate = parseFloat(val) || 0;
  persistState();
  renderResults();
}

function updateTierLimit(id, ti, val) {
  const v = String(val).replace(/[\s\u202f\u00a0]/g, '').trim();
  state.banks.find(b => b.id === id).tiers[ti].limit = v === '' ? null : (parseRaw(v) || 0);
  persistState();
  renderResults();
}

function updateBalance(id, rawVal) {
  state.banks.find(b => b.id === id).balance = parseRaw(rawVal);
  persistState();
  renderResults();
}

function updateName(id, val) {
  state.banks.find(b => b.id === id).name = val;
  persistState();
  renderResults();
  renderSaveBar();
}

function updateStep(val) {
  state.step = parseRaw(val) || 10000;
  persistState();
}

function move(fromId, toId) {
  const from = state.banks.find(b => b.id === fromId);
  const to   = state.banks.find(b => b.id === toId);
  const actual = Math.min(state.step, from.balance);
  from.balance = Math.max(0, from.balance - actual);
  to.balance  += actual;
  const fe = document.getElementById('balance-' + fromId);
  const te = document.getElementById('balance-' + toId);
  if (fe && document.activeElement !== fe) fe.value = fmtNum(from.balance);
  if (te && document.activeElement !== te) te.value = fmtNum(to.balance);
  persistState();
  renderResults();
}

/* ── render pieces ── */
function renderBankCard(bank) {
  const id = bank.id;
  const canRemove = state.banks.length > 1;

  const tiersHtml = bank.tiers.map((tier, i) => {
    const isLast = i === bank.tiers.length - 1;
    const showRm = bank.tiers.length > 1;
    const limitVal = tier.limit !== null ? fmtNum(tier.limit) : '';
    return `<div class="tier-row">
      <input type="number" class="rate-input" value="${tier.rate}" step="0.1" min="0" max="100"
        onchange="updateTierRate(${id},${i},this.value)">
      <span class="lbl">%</span>
      ${!isLast
        ? `<span class="lbl">≤</span>
           <input type="text" class="limit-input" value="${limitVal}"
             placeholder="limit"
             onfocus="this.value=this.value.replace(/[\\s\\u202f]/g,'')"
             onblur="updateTierLimit(${id},${i},this.value);this.value=state.banks.find(b=>b.id===${id}).tiers[${i}].limit!==null?fmtNum(state.banks.find(b=>b.id===${id}).tiers[${i}].limit):''">
           <span class="lbl">Kč</span>`
        : `<span class="rest-lbl">then for rest</span>`}
      ${showRm ? `<button class="remove-tier-btn" onclick="removeTier(${id},${i})">×</button>` : ''}
    </div>`;
  }).join('');

  // move-to buttons: one per other bank
  const moveBtns = state.banks
    .filter(b => b.id !== id)
    .map(b => `<button class="move-target-btn" onclick="move(${id},${b.id})">▶ ${b.name}</button>`)
    .join('');

  return `<div class="bank-card">
    <div class="bank-header">
      <input class="bank-name-input" type="text" value="${bank.name.replace(/"/g,'&quot;')}"
        oninput="updateName(${id},this.value)" placeholder="Bank name">
      ${canRemove ? `<button class="remove-bank-btn" onclick="removeBank(${id})">×</button>` : ''}
    </div>
    <div class="tiers">${tiersHtml}</div>
    <button class="add-tier-btn" onclick="addTier(${id})">+ add tier</button>
    <div class="balance-section">
      <div class="balance-row">
        <label>Balance</label>
        <input type="text" id="balance-${id}" value="${fmtNum(bank.balance)}"
          onfocus="this.value=String(Math.round(state.banks.find(b=>b.id===${id}).balance))"
          onblur="updateBalance(${id},this.value);this.value=fmtNum(state.banks.find(b=>b.id===${id}).balance)"
          onkeydown="if(event.key==='Enter'){updateBalance(${id},this.value);this.value=fmtNum(state.banks.find(b=>b.id===${id}).balance);this.blur()}">
        <span class="cur">Kč</span>
      </div>
      ${state.banks.length > 1 ? `<div class="move-targets">${moveBtns}</div>` : ''}
    </div>
  </div>`;
}

function renderResults() {
  const results = state.banks.map(b => ({ bank: b, res: calcInterest(b) }));
  const grand = results.reduce((s, r) => s + r.res.total, 0);
  const totBal = totalBalance();

  // per-bank diffs vs saved
  const savedById = {};
  if (saved) saved.banks.forEach(sb => { savedById[sb.id] = sb; });

  const banksHtml = results.map(({ bank, res }) => {
    const bkd = res.breakdown.map(b =>
      `<span>${fmt(b.chunk)} @ ${b.rate}% = ${fmtI(b.interest)}</span>`
    ).join('<br>');

    let diffHtml = '';
    if (saved && savedById[bank.id] !== undefined) {
      const d = res.total - savedById[bank.id].interest;
      if (Math.abs(d) >= 0.005) {
        const cls = d > 0 ? 'diff-pos' : 'diff-neg';
        diffHtml = `<span class="diff-badge ${cls}">${fmtDiff(d)}</span>`;
      }
    }

    return `<div class="result-bank">
      <div class="rlabel">${bank.name}</div>
      <div class="result-interest">${fmtI(res.total)}<span style="font-size:10px;color:#ccc;font-weight:400"> /yr</span>${diffHtml}</div>
      <div class="result-balance-lbl">${fmt(bank.balance)}</div>
      <div class="tier-breakdown">${bkd || '<span style="color:#ddd">—</span>'}</div>
    </div>`;
  }).join('');

  let totalDiffHtml = '';
  if (saved) {
    const d = grand - saved.interest;
    if (Math.abs(d) >= 0.005) {
      const cls = d > 0 ? 'diff-pos' : 'diff-neg';
      totalDiffHtml = `<span class="diff-badge ${cls}">${fmtDiff(d)}</span>`;
    } else {
      totalDiffHtml = `<span class="diff-badge diff-neu">no change</span>`;
    }
  }

  let monthlyDiffHtml = '';
  if (saved) {
    const d = (grand - saved.interest) * 0.85 / 12;
    if (Math.abs(d) >= 0.001) {
      const cls = d > 0 ? 'diff-pos' : 'diff-neg';
      monthlyDiffHtml = `<span class="diff-badge ${cls}">${fmtDiff(d)}</span>`;
    } else {
      monthlyDiffHtml = `<span class="diff-badge diff-neu">no change</span>`;
    }
  }

  document.getElementById('results').innerHTML =
    `<div class="results-row">${banksHtml}</div>
     <div class="results-total">
       <div class="total-row">
         <span class="total-label">Total yearly</span>
         <span class="total-amount">${fmtI(grand)}</span>
         ${totalDiffHtml}
         <span class="total-sub">· balance ${fmt(totBal)}</span>
       </div>
       <div class="total-row">
         <span class="total-label">Monthly after 15% tax</span>
         <span class="total-amount muted">${fmtI(grand * 0.85 / 12)}</span>
         ${monthlyDiffHtml}
         <span class="total-sub">/mo &nbsp;·&nbsp; ${fmtI(grand * 0.85)}/yr after tax</span>
       </div>
     </div>`;
}

function renderSaveBar() {
  const bar = document.getElementById('save-bar');
  if (!saved) {
    bar.innerHTML = `
      <span class="save-label">Snapshot</span>
      <button class="save-btn primary" onclick="saveSnapshot()">Save current state</button>
      <span class="save-label" style="color:#ccc">— save to track changes vs a reference point</span>`;
  } else {
    const balDiff = totalBalance() - saved.balance;
    let balDiffHtml = '';
    if (Math.abs(balDiff) >= 1) {
      const cls = balDiff > 0 ? 'diff-pos' : 'diff-neg';
      balDiffHtml = `<span class="diff-badge ${cls}">${fmtDiff(balDiff)} balance</span>`;
    }
    const hasConfig = !!saved.banksConfig;
    bar.innerHTML = `
      <span class="save-label">Snapshot</span>
      <button class="save-btn primary" onclick="saveSnapshot()">Overwrite</button>
      ${hasConfig ? `<button class="save-btn restore" onclick="restoreSnapshot()">↩ Restore to snapshot</button>` : ''}
      <button class="save-btn danger" onclick="clearSnapshot()">Delete snapshot</button>
      <span class="saved-snapshot">
        saved at <strong>${saved.at}</strong>
        · ${fmtI(saved.interest)}/yr · ${fmt(saved.balance)}
        ${balDiffHtml}
      </span>`;
  }
}

function render() {
  const container = document.getElementById('banks-container');
  container.innerHTML =
    state.banks.map(b => renderBankCard(b)).join('') +
    `<button class="add-bank-card" onclick="addBank()">+ add bank</button>`;
  renderSaveBar();
  renderResults();
}

loadFromStorage();
// sync step display after load
const stepEl = document.getElementById('step-input');
if (stepEl) stepEl.value = fmtNum(state.step);
render();
</script>
</body>
</html>
